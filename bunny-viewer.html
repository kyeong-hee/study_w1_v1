<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunny Figure Viewer</title>
<style>
  :root{
    --bg-1:#fdfaf5; --bg-2:#ebe4d9;
    --ink:#2b2622; --ink-2:#776d63; --line:rgba(43,38,34,.11);
    --panel:rgba(255,253,250,.8);
    --focus:#5b7cfa;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 95% at 38% 32%, var(--bg-1) 0%, #f4eee6 50%, var(--bg-2) 100%);
    color:var(--ink);
    font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; outline:none}
  #scene:active{cursor:grabbing}

  .panel{
    position:fixed; right:24px; top:50%; transform:translateY(-50%);
    width:264px; padding:24px 22px 20px;
    background:var(--panel);
    -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
    border:1px solid rgba(255,255,255,.75); border-radius:18px;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 24px 60px -24px rgba(70,52,34,.28), 0 2px 8px rgba(70,52,34,.06);
  }
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); font-weight:600}
  h1{font-size:22px; font-weight:650; margin-top:6px; letter-spacing:-.01em; line-height:1.2}
  .desc{font-size:13px; line-height:1.55; color:var(--ink-2); margin-top:8px}

  .group{margin-top:20px; padding-top:16px; border-top:1px solid var(--line)}
  .group h2{display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); font-weight:600}
  .group h2 output{letter-spacing:0; text-transform:none; color:var(--ink); font-weight:550; font-size:12.5px}

  .swatches{display:flex; gap:12px; margin-top:12px}
  .swatch{
    appearance:none; border:0; background:none; padding:0; cursor:pointer;
    width:44px; height:44px; border-radius:50%; position:relative; flex:none;
  }
  .swatch::before{
    content:""; position:absolute; inset:5px; border-radius:50%; background:var(--c);
    box-shadow:inset 0 -4px 7px rgba(0,0,0,.08), inset 0 2px 3px rgba(255,255,255,.7), 0 1px 2px rgba(0,0,0,.14);
    transition:transform .25s cubic-bezier(.3,.7,.2,1);
  }
  .swatch::after{content:""; position:absolute; inset:0; border-radius:50%; border:1.5px solid transparent; transition:border-color .2s}
  .swatch:hover::before{transform:scale(1.06)}
  .swatch[aria-checked="true"]::after{border-color:var(--ink)}
  .swatch:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

  .seg{position:relative; display:grid; grid-template-columns:1fr 1fr; margin-top:12px;
    background:rgba(43,38,34,.07); border-radius:999px; padding:4px}
  .seg .thumb{position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px); border-radius:999px;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
    transition:transform .32s cubic-bezier(.3,.7,.2,1)}
  .seg[data-value="metal"] .thumb{transform:translateX(100%)}
  .seg button{position:relative; z-index:1; appearance:none; border:0; background:none; font:inherit;
    font-size:13px; font-weight:600; color:var(--ink-2); padding:9px 0; cursor:pointer; border-radius:999px;
    transition:color .2s}
  .seg button[aria-checked="true"]{color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--focus); outline-offset:1px}

  .motions{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
  .motion{appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.6); border-radius:12px;
    padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:4px;
    font:inherit; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer;
    transition:background .2s, color .2s, border-color .2s, transform .15s}
  .motion svg{flex:none}
  .motion:hover{background:#fff}
  .motion:active{transform:scale(.96)}
  .motion.is-active{background:var(--ink); color:#fff; border-color:var(--ink)}
  .motion:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

  .hint{margin-top:20px; font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:8px}
  .hint svg{flex:none}

  @media (max-width:760px){
    .panel{top:auto; bottom:16px; left:16px; right:16px; width:auto; transform:none;
      padding:14px 16px 16px; display:grid; grid-template-columns:auto 1fr; column-gap:20px; border-radius:16px}
    .intro{grid-column:1/-1}
    .desc,.hint{display:none}
    .eyebrow{font-size:10px}
    h1{font-size:17px; margin-top:2px}
    .group{margin-top:12px; padding-top:12px}
    .swatches{gap:4px; margin-top:8px}
    .swatch{width:40px; height:40px}
    .seg{margin-top:8px}
    .seg button{padding:8px 0}
    .motion-group{grid-column:1/-1}
    .motions{margin-top:8px; gap:6px}
    .motion{flex-direction:row; justify-content:center; gap:6px; padding:8px 0}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D bunny figure on a pedestal. Drag horizontally to rotate."></canvas>

<aside class="panel" aria-label="Figure options">
  <div class="intro">
    <p class="eyebrow">Vinyl Figure · No. 01</p>
    <h1>Cream Bunny</h1>
    <p class="desc">Soft-touch collectible figure. Pick a colorway and finish to preview it live.</p>
  </div>

  <div class="group">
    <h2>Color <output id="colorName">Cream</output></h2>
    <div class="swatches" role="radiogroup" aria-label="Color">
      <button class="swatch" role="radio" aria-checked="true"  aria-label="Cream"  data-name="Cream"  data-color="#F7E6B5" style="--c:#F7E6B5"></button>
      <button class="swatch" role="radio" aria-checked="false" aria-label="Sakura" data-name="Sakura" data-color="#F5C3CF" style="--c:#F5C3CF"></button>
      <button class="swatch" role="radio" aria-checked="false" aria-label="Mint"   data-name="Mint"   data-color="#C6E6D2" style="--c:#C6E6D2"></button>
    </div>
  </div>

  <div class="group">
    <h2>Finish <output id="finishName">Matte</output></h2>
    <div class="seg" role="radiogroup" aria-label="Finish" data-value="matte">
      <span class="thumb" aria-hidden="true"></span>
      <button role="radio" aria-checked="true"  data-finish="matte">Matte</button>
      <button role="radio" aria-checked="false" data-finish="metal">Metal</button>
    </div>
  </div>

  <div class="group motion-group">
    <h2>Motion <output id="motionName">Idle</output></h2>
    <div class="motions">
      <button class="motion" data-motion="jump" aria-label="Jump">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6.5 9.5 12 4l5.5 5.5M5 20h14"/></svg>
        <span>Jump</span>
      </button>
      <button class="motion" data-motion="pet" aria-label="Pet">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.1 4.1 0 0 1 12 7.4a4.1 4.1 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>
        <span>Pet</span>
      </button>
      <button class="motion" data-motion="spin" aria-label="Spin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.35-5.65M20 4v4.5h-4.5"/></svg>
        <span>Spin</span>
      </button>
    </div>
  </div>

  <p class="hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
    Drag to rotate · Tap the bunny to pet
  </p>
</aside>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';

/* ---------------- Renderer / scene ---------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const TARGET = new THREE.Vector3(0, 1.05, 0);
const POLAR = 1.36;               // fixed vertical angle (~12° above horizon)

const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enablePan = false;
controls.enableZoom = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.7;
controls.minPolarAngle = POLAR;
controls.maxPolarAngle = POLAR;

/* ---------------- Three-point studio lighting ---------------- */
scene.add(new THREE.HemisphereLight(0xfff7ec, 0xd8d0c4, 0.35));

const key = new THREE.DirectionalLight(0xfff0dc, 2.3);
key.position.set(3.2, 5.6, 4.4);
key.target.position.set(0, 1, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2.4, bottom: -1.6, near: 1, far: 16 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0xe4ecff, 0.85);
fill.position.set(-4.5, 2.4, 3.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.9);
rim.position.set(-1.6, 4.2, -5.2);
scene.add(rim);

/* ---------------- Materials ---------------- */
const FINISH = {
  matte: { metalness: 0, roughness: 0.56, clearcoat: 0.18, clearcoatRoughness: 0.5, sheen: 0.4, env: 0.55 },
  metal: { metalness: 1, roughness: 0.2,  clearcoat: 0.6,  clearcoatRoughness: 0.08, sheen: 0, env: 1.6 }
};
const bodyMat = new THREE.MeshPhysicalMaterial({
  color: '#F7E6B5', envMap: envTex, envMapIntensity: FINISH.matte.env,
  metalness: 0, roughness: FINISH.matte.roughness,
  clearcoat: FINISH.matte.clearcoat, clearcoatRoughness: FINISH.matte.clearcoatRoughness,
  sheen: FINISH.matte.sheen, sheenRoughness: 0.8, sheenColor: new THREE.Color(0xffffff)
});
const target = { color: new THREE.Color('#F7E6B5'), ...FINISH.matte };

const decalProps = { side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 };
const inkMat    = new THREE.MeshPhysicalMaterial({ color: '#1c1617', roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.2 });
const eyeMat    = new THREE.MeshPhysicalMaterial({ color: '#120e10', roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.04 });
const whiteMat  = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.3, emissive: '#ffffff', emissiveIntensity: 0.35 });
const blushMat  = new THREE.MeshStandardMaterial({ color: '#F4B1BD', roughness: 0.6, ...decalProps });
const mouthMat  = new THREE.MeshStandardMaterial({ color: '#2a1a1c', roughness: 0.5, ...decalProps });
const tongueMat = new THREE.MeshStandardMaterial({ color: '#EE95A5', roughness: 0.45, ...decalProps, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
const earPinkMat = new THREE.MeshPhysicalMaterial({ color: '#F3B4BF', roughness: 0.5, clearcoat: 0.2 });

const sphereGeo = new THREE.SphereGeometry(1, 48, 32);

/* ---------------- Pedestal ---------------- */
const PED_R = 1.15, PED_H = 0.36, PED_E = 0.06;
function pedestalProfile() {
  const p = [new THREE.Vector2(0, -PED_H), new THREE.Vector2(PED_R - PED_E, -PED_H)];
  for (let k = 1; k <= 10; k++) {
    const a = -Math.PI / 2 + (Math.PI / 2) * k / 10;
    p.push(new THREE.Vector2(PED_R - PED_E + PED_E * Math.cos(a), -PED_H + PED_E + PED_E * Math.sin(a)));
  }
  p.push(new THREE.Vector2(PED_R, -PED_E));
  for (let k = 1; k <= 10; k++) {
    const a = (Math.PI / 2) * k / 10;
    p.push(new THREE.Vector2(PED_R - PED_E + PED_E * Math.cos(a), -PED_E + PED_E * Math.sin(a)));
  }
  p.push(new THREE.Vector2(0, 0));
  return p;
}
const pedestal = new THREE.Mesh(
  new THREE.LatheGeometry(pedestalProfile(), 160),
  new THREE.MeshPhysicalMaterial({ color: '#EEE8E0', roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.3 })
);
scene.add(pedestal);
const band = new THREE.Mesh(
  new THREE.TorusGeometry(PED_R + 0.001, 0.007, 12, 200),
  new THREE.MeshStandardMaterial({ color: '#C9BBA8', roughness: 0.35, metalness: 0.4 })
);
band.rotation.x = Math.PI / 2;
band.position.y = -0.13;
scene.add(band);

// soft floor shadow under the pedestal
function radialTexture(stops) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([o, col]) => grd.addColorStop(o, col));
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const floorShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(3.8, 3.8),
  new THREE.MeshBasicMaterial({
    map: radialTexture([[0, 'rgba(60,45,30,0.55)'], [0.55, 'rgba(60,45,30,0.35)'], [0.75, 'rgba(60,45,30,0.08)'], [1, 'rgba(60,45,30,0)']]),
    transparent: true, depthWrite: false
  })
);
floorShadow.rotation.x = -Math.PI / 2;
floorShadow.position.y = -PED_H - 0.001;
scene.add(floorShadow);

/* ---------------- Character ---------------- */
const character = new THREE.Group();
scene.add(character);
const castAll = [];

// Head: wide "mochi bun" dome (superellipse profile, flatter underside)
const HEAD_Y = 0.5;
const H = { a: 0.8, yc: 0.34, bTop: 0.8, bBot: 0.34, nTop: 2.25, nBot: 2.6 };
const headPts = [];
for (let i = 0; i <= 120; i++) {
  const t = -Math.PI / 2 + Math.PI * i / 120;
  const c = Math.cos(t), s = Math.sin(t);
  const n = s < 0 ? H.nBot : H.nTop, b = s < 0 ? H.bBot : H.bTop;
  const r = H.a * Math.pow(Math.abs(c), 2 / n);
  const y = H.yc + b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
  headPts.push(new THREE.Vector2(Math.max(r, 0), y));
}
const head = new THREE.Mesh(new THREE.LatheGeometry(headPts, 192), bodyMat);
head.position.y = HEAD_Y;
head.rotation.y = Math.PI / 192; // keep the lathe seam/edges off the face centre line (stable raycasts)
character.add(head); castAll.push(head);

// Body: small rounded pear
const bodyPts = new THREE.SplineCurve([
  new THREE.Vector2(0.0, 0.01), new THREE.Vector2(0.28, 0.02), new THREE.Vector2(0.44, 0.08),
  new THREE.Vector2(0.515, 0.21), new THREE.Vector2(0.51, 0.35), new THREE.Vector2(0.47, 0.5),
  new THREE.Vector2(0.4, 0.62), new THREE.Vector2(0.24, 0.7), new THREE.Vector2(0.0, 0.72)
]).getPoints(90).map(v => new THREE.Vector2(Math.max(v.x, 0), v.y));
const body = new THREE.Mesh(new THREE.LatheGeometry(bodyPts, 128), bodyMat);
character.add(body); castAll.push(body);

// Feet
[-1, 1].forEach(s => {
  const foot = new THREE.Mesh(sphereGeo, bodyMat);
  foot.scale.set(0.13, 0.085, 0.16);
  foot.position.set(s * 0.17, 0.075, 0.27);
  character.add(foot); castAll.push(foot);
});

// Arms: tiny nubs pointing out and down
const armGeo = new THREE.CapsuleGeometry(0.075, 0.13, 10, 20);
[-1, 1].forEach(s => {
  const arm = new THREE.Mesh(armGeo, bodyMat);
  const ang = 0.98;
  arm.position.set(s * (0.44 + 0.1 * Math.sin(ang)), 0.47 - 0.1 * Math.cos(ang), 0.07);
  arm.rotation.set(0.25, 0, s * ang);
  character.add(arm); castAll.push(arm);
});

// Ears: long upright ears with pink inner
const earGeo = new THREE.CapsuleGeometry(0.115, 0.68, 12, 28);
const earInGeo = new THREE.CapsuleGeometry(0.06, 0.46, 12, 24);
const ears = [];
[-1, 1].forEach(s => {
  const ear = new THREE.Group();
  ear.position.set(s * 0.18, HEAD_Y + 1.02, -0.02);
  ear.rotation.set(-0.06, 0, -s * 0.09);
  const outer = new THREE.Mesh(earGeo, bodyMat);
  outer.scale.set(1, 1, 0.6);
  outer.position.y = 0.455;
  const inner = new THREE.Mesh(earInGeo, earPinkMat);
  inner.scale.set(1, 1, 0.37);
  inner.position.set(s * 0.012, 0.52, 0.052);
  ear.add(outer, inner);
  character.add(ear); castAll.push(outer, inner);
  ears.push({ g: ear, s, k: s < 0 ? 140 : 158, th: 0, v: 0 });
});

/* ---------------- Face (placed on the head surface) ---------------- */
character.updateMatrixWorld(true);
const ray = new THREE.Raycaster();
const UP = new THREE.Vector3(0, 1, 0);

// u = horizontal angle in degrees from the front, yh = height above head base
function surf(uDeg, yh) {
  const u = THREE.MathUtils.degToRad(uDeg);
  ray.set(new THREE.Vector3(Math.sin(u) * 5, HEAD_Y + yh, Math.cos(u) * 5),
          new THREE.Vector3(-Math.sin(u), 0, -Math.cos(u)));
  let hit = ray.intersectObject(head, false)[0];
  if (!hit) return surf(uDeg + 0.01, yh);
  const n = (hit.normal ? hit.normal.clone() : hit.face.normal.clone()).transformDirection(head.matrixWorld).normalize();
  return { p: hit.point.clone(), n };
}

const Y_SCALE = 73; // makes yh units comparable to degrees for smoothing
function densify(pts, closed, count) {
  const c = new THREE.CatmullRomCurve3(pts.map(([u, y]) => new THREE.Vector3(u, y * Y_SCALE, 0)), closed, 'centripetal');
  const out = c.getSpacedPoints(count).map(v => [v.x, v.y / Y_SCALE]);
  return closed ? out.slice(0, count) : out;
}

function surfaceLine(pts, radius, lift, mat, samples = 40) {
  const dense = densify(pts, false, samples);
  const v = dense.map(([u, y]) => { const s = surf(u, y); return s.p.addScaledVector(s.n, lift); });
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(v), samples * 2, radius, 12, false), mat));
  [v[0], v[v.length - 1]].forEach(e => {
    const cap = new THREE.Mesh(sphereGeo, mat); cap.scale.setScalar(radius); cap.position.copy(e); g.add(cap);
  });
  return g;
}

function surfacePatch(center, loop, lift, mat, rings = 8) {
  const M = loop.length, pos = [], idx = [];
  const push = (u, y) => { const s = surf(u, y); s.p.addScaledVector(s.n, lift); pos.push(s.p.x, s.p.y, s.p.z); };
  push(center[0], center[1]);
  for (let r = 1; r <= rings; r++) {
    const f = r / rings;
    for (let j = 0; j < M; j++) push(center[0] + (loop[j][0] - center[0]) * f, center[1] + (loop[j][1] - center[1]) * f);
  }
  const v = (r, j) => 1 + (r - 1) * M + (j % M);
  for (let j = 0; j < M; j++) idx.push(0, v(1, j), v(1, j + 1));
  for (let r = 2; r <= rings; r++) for (let j = 0; j < M; j++) {
    const a = v(r - 1, j), b = v(r, j), c = v(r, j + 1), d = v(r - 1, j + 1);
    idx.push(a, b, c, a, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx); geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}

const ellipseLoop = (cu, cy, au, ay, M = 56) =>
  Array.from({ length: M }, (_, j) => { const a = j / M * Math.PI * 2; return [cu + au * Math.cos(a), cy + ay * Math.sin(a)]; });

function bezier(p0, p1, p2, n = 12) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = (1 - t) ** 2, b = 2 * t * (1 - t), c = t * t;
    out.push([a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]]);
  }
  return out;
}

function makeEye(uDeg, yh) {
  const { p, n } = surf(uDeg, yh);
  const t = new THREE.Vector3().crossVectors(UP, n).normalize();
  const b = new THREE.Vector3().crossVectors(n, t).normalize();
  const g = new THREE.Group();
  g.position.copy(p);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(t, b, n));

/* ---------------- Motion system ---------------- */
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const easeInOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION_LABEL = { jump: 'Jump', pet: 'Pet', spin: 'Spin' };
const action = { type: null, t: 0, dur: 0, flags: {} };
let heartTimer = 0;
const BLUSH_BASE = new THREE.Color('#F4B1BD'), BLUSH_HOT = new THREE.Color('#F7889F');
const anim = { happy: 0, blinkAt: 2.5, blinkT: -1, time: 0 };

function kickEars(v) { ears.forEach(e => { e.v += v * (0.9 + Math.random() * 0.2); }); }

function playMotion(type) {
  if (action.type === 'pet' && type === 'pet') {           // keep petting → extend
    action.dur = Math.max(action.dur, action.t + 2.6);
    return;
  }
  if (action.type) return;                                   // busy with another motion
  action.type = type; action.t = 0; action.flags = {};
  action.dur = { jump: 1.25, pet: 2.9, spin: 1.1 }[type];
  heartTimer = 0;
  updateMotionUI();
}

function updateMotionUI() {
  motionBtns.forEach(b => b.classList.toggle('is-active', b.dataset.motion === action.type));
  motionName.textContent = action.type ? MOTION_LABEL[action.type] : 'Idle';
}

function poseFor(dt) {
  const pose = { y: 0, sy: 1, rotY: 0, bodyZ: 0, tiltZ: 0, nodX: 0, earTarget: 0, happy: 0, hand: 0, handX: 0, handYaw: 0 };
  if (!action.type) return pose;
  action.t += dt;
  const t = action.t, F = action.flags;

  if (action.type === 'jump') {
    if (t < 0.18) {                                          // anticipation squash
      pose.sy = 1 - 0.16 * Math.sin((t / 0.18) * Math.PI / 2);
      pose.earTarget = 0.25;
    } else if (t < 0.78) {                                   // airborne arc with stretch
      if (!F.up) { F.up = true; kickEars(5); }
      const p = (t - 0.18) / 0.6;
      pose.y = 0.75 * 4 * p * (1 - p);
      pose.sy = 1 + 0.12 * Math.abs(Math.cos(Math.PI * p)) * (p < 0.5 ? 1 : 0.6);
      pose.earTarget = -0.15;
    } else {                                                 // landing squash + settle
      if (!F.land) { F.land = true; kickEars(8); }
      const q = Math.min(1, (t - 0.78) / 0.47);
      pose.sy = 1 - 0.18 * Math.exp(-5 * q) * Math.cos(3 * Math.PI * q);
    }
  }

  if (action.type === 'spin') {
    const p = Math.min(1, t / action.dur);
    pose.rotY = Math.PI * 2 * easeInOutCubic(p);
    pose.y = 0.22 * Math.sin(Math.PI * p);
    pose.sy = 1 + 0.06 * Math.sin(Math.PI * p);
    pose.earTarget = 0.6 * Math.sin(Math.PI * p);           // ears flare out while spinning
    pose.tiltZ = -0.08 * Math.sin(Math.PI * p);
  }

  if (action.type === 'pet') {
    const env = THREE.MathUtils.smoothstep(t, 0, 0.3) * (1 - THREE.MathUtils.smoothstep(t, action.dur - 0.45, action.dur));
    const ph = Math.sin(2 * Math.PI * 1.25 * Math.max(0, t - 0.2));
    pose.hand = t < 0.3 ? easeOutBack(Math.min(1, t / 0.3)) : 1 - THREE.MathUtils.smoothstep(t, action.dur - 0.35, action.dur);
    pose.handX = 0.24 * ph;
    pose.handYaw = -0.25 * ph;
    pose.tiltZ = -0.11 * ph * env;                           // head leans into the hand
    pose.nodX = 0.06 * env;
    pose.bodyZ = 0.025 * ph * env;
    pose.sy = 1 - 0.025 * env * (0.5 + 0.5 * Math.abs(ph));
    pose.earTarget = 0.6 * env;                              // ears relax backwards
    pose.happy = (t > 0.15 && t < action.dur - 0.1) ? 1 : 0;
    heartTimer -= dt;
    if (t > 0.3 && t < action.dur - 0.35 && heartTimer <= 0) {
      spawnHeart();
      heartTimer = 0.11 + Math.random() * 0.08;
    }
  }

  if (t >= action.dur) {
    action.type = null;
    updateMotionUI();
  }
  return pose;
}

function updateCharacter(dt) {
  anim.time += dt;
  const pose = poseFor(dt);
  const breath = reduceMotion ? 0 : Math.sin(anim.time * 2.1) * 0.012;

  character.position.y = pose.y;
  character.rotation.set(0, pose.rotY, pose.bodyZ);
  const sy = pose.sy + breath, sxz = 1 / Math.sqrt(sy);
  character.scale.set(sxz, sy, sxz);
  headRig.rotation.set(pose.nodX, 0, pose.tiltZ);

  // ears: damped springs → soft secondary motion
  for (const e of ears) {
    const acc = -e.k * (e.th - pose.earTarget) - 9 * e.v;
    e.v += acc * dt; e.th += e.v * dt;
    e.g.rotation.set(e.base.x - e.th * 0.6, e.base.y, e.base.z - e.s * e.th * 0.55);
  }

  // hand
  placeHand(pose.handX, 0.24, pose.hand, pose.handYaw);

  // eyes: blink + happy ^ ^
  anim.happy += (pose.happy - anim.happy) * (1 - Math.exp(-dt * 14));
  if (anim.time > anim.blinkAt && anim.blinkT < 0) { anim.blinkT = 0; }
  let open = 1;
  if (anim.blinkT >= 0) {
    anim.blinkT += dt;
    open = 1 - Math.sin(Math.min(1, anim.blinkT / 0.16) * Math.PI);
    if (anim.blinkT >= 0.16) { anim.blinkT = -1; anim.blinkAt = anim.time + 2.2 + Math.random() * 3.5; }
  }
  const showHappy = anim.happy > 0.5;
  eyes.forEach(e => { e.visible = !showHappy; e.scale.y = Math.max(0.07, open * (1 - anim.happy)); });
  happyEyes.forEach(h => { h.visible = showHappy; });
  blushMat.color.copy(BLUSH_BASE).lerp(BLUSH_HOT, anim.happy);

  updateHearts(dt);
}

/* ---------------- Resize / framing ---------------- */
const panel = document.querySelector('.panel');
const mobileMQ = window.matchMedia('(max-width: 760px)');
let azimuth = 0.35;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  // keep the figure centred in the area not covered by the panel
  const r = panel.getBoundingClientRect();
  let fw = 1, fh = 1;
  if (mobileMQ.matches) {
    const occ = Math.max(0, h - r.top + 8);
    camera.setViewOffset(w, h, 0, occ / 2, w, h);
    fh = Math.max(0.35, (h - occ) / h);
  } else {
    const occ = Math.max(0, w - r.left + 8);
    camera.setViewOffset(w, h, occ / 2, 0, w, h);
    fw = Math.max(0.35, (w - occ) / w);
  }
  camera.updateProjectionMatrix();

  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(1.6 / (tanV * fh), 1.35 / (tanV * camera.aspect * fw)) + 0.7;

  azimuth = controls.getAzimuthalAngle ? controls.getAzimuthalAngle() : azimuth;
  camera.position.set(
    TARGET.x + dist * Math.sin(POLAR) * Math.sin(azimuth),
    TARGET.y + dist * Math.cos(POLAR),
    TARGET.z + dist * Math.sin(POLAR) * Math.cos(azimuth)
  );
  controls.minDistance = controls.maxDistance = dist;
  controls.update();
}
// initial azimuth before the first controls.update
camera.position.set(Math.sin(azimuth), 0, Math.cos(azimuth)).add(TARGET);
controls.update();
window.addEventListener('resize', resize);
mobileMQ.addEventListener('change', resize);
resize();

/* ---------------- Loop ---------------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const k = 1 - Math.exp(-dt * 7);
  bodyMat.color.lerp(target.color, k);
  bodyMat.metalness += (target.metalness - bodyMat.metalness) * k;
  bodyMat.roughness += (target.roughness - bodyMat.roughness) * k;
  bodyMat.clearcoat += (target.clearcoat - bodyMat.clearcoat) * k;
  bodyMat.clearcoatRoughness += (target.clearcoatRoughness - bodyMat.clearcoatRoughness) * k;
  bodyMat.sheen += (target.sheen - bodyMat.sheen) * k;
  bodyMat.envMapIntensity += (target.env - bodyMat.envMapIntensity) * k;

  controls.update();
  updateCharacter(dt);
  renderContactShadow();
  renderer.shadowMap.needsUpdate = true;   // character moves → refresh key-light shadow for this frame
  renderer.render(scene, camera);
});
</script>
